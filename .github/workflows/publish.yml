name: Publish

on:
  push:
    branches: [master]

jobs:
  publish-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test project
        run: npm test

      - name: Determine next version
        run: |
          latest_tag=$(git tag --list 'v*.*.*' | sed 's/^v//' | sort -V | tail -n1)
          latest_tag=${latest_tag:-0.0.0}
          echo "Latest tag: v$latest_tag"

          pkg_version=$(node -p "require('./package.json').version")
          echo "package.json version: $pkg_version"

          greater=$(printf '%s\n%s\n' "$pkg_version" "$latest_tag" | sort -V | tail -n1)

          if [ "$greater" = "$pkg_version" ] && [ "$pkg_version" != "$latest_tag" ]; then
            new_version="$pkg_version"
          else
            IFS='.' read -r major minor patch <<< "$latest_tag"
            new_version="$major.$minor.$((patch + 1))"
          fi

          echo "Next version: $new_version"
          echo "NEW_VERSION=$new_version" >> "$GITHUB_ENV"

      - name: Update package.json version
        run: |
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: npm publish

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          npm publish --registry=https://npm.pkg.github.com

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$NEW_VERSION" --title "v$NEW_VERSION" --generate-notes
